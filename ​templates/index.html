<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>E-Trade Pro - Canlı Sanal Ofis</title>
    <style>
        body { background-color: #1e1e1e; color: #fff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { margin-bottom: 5px; }
        #office-container { position: relative; width: 900px; height: 500px; margin: 20px auto; background: #2c3e50; border: 4px solid #fff; border-radius: 10px; overflow: hidden; }
        .employee { position: absolute; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .employee:hover { transform: scale(1.15); z-index: 10; }
        #tooltip { position: absolute; background: rgba(0,0,0,0.9); padding: 10px; border-radius: 5px; display: none; pointer-events: none; font-size: 14px; border: 1px solid #fff; z-index: 100; text-align: left; }
    </style>
</head>
<body>

    <h1>🏢 E-Trade Pro - Canlı Kuşbakışı Yönetim Merkezi</h1>
    <p>CEO: Mertcan | Çalışanların anlık durumunu görmek için üzerlerine gelebilirsin.</p>

    <div id="office-container">
        <div id="tooltip"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('office-container');
        const tooltip = document.getElementById('tooltip');

        socket.on('update_office', function(employees) {
            document.querySelectorAll('.employee').forEach(e => e.remove());

            for (let [name, data] of Object.entries(employees)) {
                let empDiv = document.createElement('div');
                empDiv.className = 'employee';
                empDiv.style.left = data.x + 'px';
                empDiv.style.top = data.y + 'px';
                empDiv.style.backgroundColor = data.color;
                empDiv.innerText = name;

                empDiv.addEventListener('mousemove', (e) => {
                    tooltip.style.display = 'block';
                    tooltip.style.left = (e.pageX + 15) + 'px';
                    tooltip.style.top = (e.pageY + 15) + 'px';
                    tooltip.innerHTML = `<strong>${name}</strong><br><em>${data.role}</em><br>Durum: ${data.status}`;
                });

                empDiv.addEventListener('mouseleave', () => {
                    tooltip.style.display = 'none';
                });

                container.appendChild(empDiv);
            }
        });
    </script>
</body>
</html>
